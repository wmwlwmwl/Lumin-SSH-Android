# Auto-build Android package when you push a version tag: android-v0.1.0
# Creates a GitHub Release with notes in the same structure as the desktop app:
#   ## 更新日志 / ## 产物下载 / ## 安装/卸载方法
#
# Optional signing Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#android-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$VERSION"

      - name: Sync VERSION file (tag is source of truth for this build)
        run: |
          echo "${{ steps.ver.outputs.version }}" > VERSION
          cat VERSION

      - name: Extract changelog section for this version
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # 从 CHANGELOG.md 抽取 ## [x.y.z] 段落，转成 PC 风格的「- 列表」
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Match ## [0.1.0] ... until next ## [
          pat = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.M | re.S,
          )
          m = pat.search(text)
          bullets = []
          if m:
              body = m.group(1)
              for line in body.splitlines():
                  s = line.strip()
                  if not s:
                      continue
                  if s.startswith("### "):
                      # 小节当小标题，转成粗体行
                      bullets.append(f"- **{s[4:].strip()}**")
                      continue
                  if s.startswith("- "):
                      bullets.append(s)
                      continue
                  if s.startswith("* "):
                      bullets.append("- " + s[2:])
                      continue
              # 去掉空的单独分类标题行（若其后没有条目会显得干）
          if not bullets:
              bullets = [
                  f"- Android {version} 发布",
                  "- 详见仓库 CHANGELOG.md",
              ]
          Path("release-changelog.txt").write_text("\n".join(bullets) + "\n", encoding="utf-8")
          print("changelog bullets:")
          print("\n".join(bullets))
          PY
          # expose multiline for body
          {
            echo "body<<EOF"
            cat release-changelog.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (optional)
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing: disabled (unsigned release APK)"
          fi

      - name: Build release APK
        env:
          LUMIN_STORE_FILE: ${{ steps.sign.outputs.enabled == 'true' && steps.sign.outputs.keystore || '' }}
          LUMIN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package APK + SHA256
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          test -f "$APK"
          # 命名对齐桌面风格：Lumin-V{version}-android.apk
          NAME="Lumin-V${VERSION}-android.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | sed "s|  .*|  ${NAME}|" > "${NAME}.sha256"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$NAME.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME" "$NAME.sha256"
          cat "$NAME.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Lumin SSH Android v${{ steps.ver.outputs.version }}"
          generate_release_notes: false
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.sha }}
          body: |
            ## 更新日志
            ${{ steps.notes.outputs.body }}

            ## 产物下载
            - Android APK ([Lumin-V${{ steps.ver.outputs.version }}-android.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Lumin-V${{ steps.ver.outputs.version }}-android.apk))：安装包
            - SHA256 校验 ([Lumin-V${{ steps.ver.outputs.version }}-android.apk.sha256](https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Lumin-V${{ steps.ver.outputs.version }}-android.apk.sha256))：校验文件完整性
            - 本 Release **仅 Android**，桌面端见 [Lumin-SSH](https://github.com/wmwlwmwl/Lumin-SSH/releases)
            - 许可见仓库 [LICENSE](LICENSE)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

